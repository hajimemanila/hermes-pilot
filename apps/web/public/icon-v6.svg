<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Hermes Pilot の favicon。アートは docs/icon-proposal-2-maskable.png（正本）から
    scripts/make-icons-from-art.py で作った icon-maskable-512-v6.png をそのまま埋めている。
    ベクターに描き直すと針の丸みが落ちて PNG と見た目がずれるため、同一画像を埋める方式。

    白枠対策（docs/PITFALLS.md P1）で外せない条件:
    - 下の rect で **viewBox 全面を単色 #06161a で塗る**（内側に角丸四角を描かない）
    - 画像は全面に敷き、余白・透明マージンを作らない（外周1pxまで不透明）
    - 差し替えるときは URL を変える（icon-v5.svg → icon-v6.svg）。favicon キャッシュは
      サイトデータ削除では消えない
  -->
  <rect width="512" height="512" fill="#06161a"/>
  <image x="0" y="0" width="512" height="512" href="data:image/png;base64,"/>
</svg>
