<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2f36"/>
      <stop offset="1" stop-color="#06161a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#1a7876" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1a7876" stop-opacity="0"/>
